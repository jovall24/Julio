<!DOCTYPE html>
<html>
    <head>
        <title>Animal Quiz</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <header>
            <h1>Animal Quiz</h1>
            <p>Test your knowledge about animals!</p>
        </header>

        <section>
            <form>
                <h2>1. Which animal is the largest animal in the world?</h2>
                <input type="radio" id="elephant" name="question1" value="Elephant">
                <label for="elephant">Elephant</label><br>

                <input type="radio" id="bluewhale" name="question1" value="Blue Whale">
                <label for="bluewhale">Blue Whale</label><br>

                <input type="radio" id="giraffe" name="question1" value="Giraffe">
                <label for="giraffe">Giraffe</label><br>

                <input type="radio" id="shark" name="question1" value="Great White Shark">
                <label for="shark">Great White Shark</label><br>

                <h2>2. Which animal is known as the king of the jungle?</h2>
                <input type="radio" id="tiger" name="question2" value="Tiger">
                <label for="tiger">Tiger</label><br>

                <input type="radio" id="lion" name="question2" value="Lion">
                <label for="lion">Lion</label><br>

                <input type="radio" id="bear" name="question2" value="Bear">
                <label for="bear">Bear</label><br>

                <input type="radio" id="wolf" name="question2" value="Wolf">
                <label for="wolf">Wolf</label><br>

                <h2>3. Which of these animals can fly? Select all that apply.</h2>
                <input type="checkbox" id="eagle" name="question3" value="Eagle">
                <label for="eagle">Eagle</label><br>

                <input type="checkbox" id="bat" name="question3" value="Bat">
                <label for="bat">Bat</label><br>

                <input type="checkbox" id="penguin" name="question3" value="Penguin">
                <label for="penguin">Penguin</label><br>

                <input type="checkbox" id="ostrich" name="question3" value="Ostrich">
                <label for="ostrich">Ostrich</label><br>

                <h2>4. Which of these animals live in the ocean? Select all that apply.</h2>
                <input type="checkbox" id="dolphin" name="question4" value="Dolphin">
                <label for="dolphin">Dolphin</label><br>

                <input type="checkbox" id="octopus" name="question4" value="Octopus">
                <label for="octopus">Octopus</label><br>

                <input type="checkbox" id="camel" name="question4" value="Camel">
                <label for="camel">Camel</label><br>

                <input type="checkbox" id="zebra" name="question4" value="Zebra">
                <label for="zebra">Zebra</label><br>

                <br>
                <input type="submit" value="Submit Quiz">
            </form>
        </section>
    </body>
</html>
